<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Formulir Data Staf</title>
    <!-- Baris di bawah ini menghubungkan HTML dengan CSS -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

  <!-- Ini adalah kontainer utama formulir kita -->
  <div class="kartu-form">
    
    <h2>Formulir Data Staf</h2>
    <p>Silakan isi detail untuk pendaftaran sistem.</p>

    <form>
      <label>Nama Lengkap:</label><br>
      <input type="text" id="inputNama" placeholder="Masukkan nama Anda"><br><br>

      <label>Divisi:</label><br>
      <select id="pilihDivisi">
        <option>Pilih Divisi...</option>
        <option>Administrasi</option>
        <option>Logistik</option>
        <option>Lapangan</option>
      </select><br><br>

      <button type="button" id="tombolSimpan">Simpan Data</button>
      
      <button type="button" id="tombolTarikData" style="background-color: #10b981; margin-top: 10px;">
        Tarik Data Pusat (API)
      </button>
    </form>

    <hr style="margin-top: 30px; margin-bottom: 20px;">
    
    <h3>Rekap Data Staf</h3>
    <table border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
      <thead>
        <tr>
          <th>Nama</th>
          <th>Divisi</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelData">
        <!-- Menunggu JavaScript mengambil data dari Supabase -->
      </tbody>
    </table>

  </div>

  <!-- 1. PANGGIL LIBRARY SUPABASE DAHULU -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. BARU PANGGIL SCRIPT KITA -->
  <script src="script.js"></script>
</body>
</html>
